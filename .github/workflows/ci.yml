name: CI

on:
  push:
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable build --locked
      - name: Distribution tests
        run: python scripts/test_distribution.py
      - name: Terminal smoke test
        if: runner.os != 'Windows'
        run: python3 scripts/smoke_tui.py
      - name: Daylight-saving boundaries
        if: runner.os != 'Windows'
        env:
          TZ: America/New_York
        run: cargo +stable test --locked half_hour_rows_cover_dst_days_exactly
      - name: Windows installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installer.ps1

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check minimum supported Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --all-targets
      - name: Verify the distributable Cargo package
        run: cargo package --locked
