[project]
name = "pomo"
version = "0.1.0"
description = "Minimal pomodoro timer TUI with a working-hours calendar"
requires-python = ">=3.13"
dependencies = [
    "textual>=1.0",
    "platformdirs>=4.0",
]

[project.scripts]
pomo = "pomo.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
